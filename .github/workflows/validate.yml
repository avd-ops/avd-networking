name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Bicep templates
        run: |
          az bicep install
          az bicep lint --file bicep/main.bicep
      - name: Build parameter files (commercial)
        run: |
          for p in parameters/lab.bicepparam parameters/enterprise.bicepparam parameters/nva-hybrid.bicepparam parameters/expressroute-enterprise.bicepparam; do
            az bicep build-params --file "$p" --stdout > /dev/null
          done
      - name: Build parameter files (usgov) and verify sovereign DNS suffixes
        env:
          AVD_CLOUD: "usgov"
          AVD_LOCATION: "usgovvirginia"
        run: |
          for p in parameters/lab.bicepparam parameters/enterprise.bicepparam parameters/nva-hybrid.bicepparam parameters/expressroute-enterprise.bicepparam; do
            out=$(az bicep build-params --file "$p" --stdout | jq -r .parametersJson)
            echo "$out" | grep -q '"usgov"'
            echo "$out" | grep -q '"usgovvirginia"'
          done
          compiled=$(az bicep build --file bicep/modules/dns.bicep --stdout)
          echo "$compiled" | grep -q "privatelink.wvd.azure.us"
          echo "$compiled" | grep -q "privatelink-global.wvd.azure.us"
      - name: ShellCheck deploy script
        run: shellcheck scripts/deploy/deploy.sh
      - name: PSScriptAnalyzer and Pester tests
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer, Pester -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error -EnableExit
          Invoke-Pester -Path ./tests -CI
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --exit-code 1 \
            --report-format json --report-path /repo/gitleaks.json 2>&1 | tee gitleaks.log && exit 0
          if [ -s gitleaks.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:7])"' gitleaks.json
          else
            tail -n 8 gitleaks.log | sed 's/^/::error::/'
          fi
          exit 1
